{% extends "layout.html" %}

{% block title %}
    History
{% endblock %}

{% block main %}
  <div class="container">
   <div class="section">
      <table class="table table-striped">
          <thead>
              <tr>
                  <th>STOCK</th>
                  <th>SHARES</th>
                  <th>PRICE</th>
                  <th>TIME</th>
                  <th>TYPE</th>
              </tr>
          </thead>
          <tbody>
               {% for h in history %}
               <tr>
                  <td>{{ h.stock }}</td>
                  <td>{{ h.shares }}</td>
                  <td>{{ usd(h.price) }}</td>
                  <td>{{ h.time }}</td>
                  <td>{{ h.type }}</td>
               </tr>
               {% endfor %}
          </tbody>
      </table>
    </div>
   </div>
{% endblock %}
