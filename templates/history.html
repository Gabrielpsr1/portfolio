{% extends "layout.html" %}

{% block title %}
    quote
{% endblock %}

{% block main %}
  <div class="container">
   <div class="section">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>STOCKS</th>
                            <th>SHARES</th>
                            <th>TIME</th>
                            <th>TRANSACTION TYPE</th>
                        </tr>
                    </thead>
                    <tbody>
                         {% for h in history %}
                         <tr>
                            <td>{{ h.stock }}</td>
                            <td>{{ h.shares}}</td>
                            <td>{{ h.time}}</td>
                            <td>{{ h.type}}</td>
                         </tr>
                         {% endfor %}
                    </tbody>
                </table>
    </div>
   </div>
{% endblock %}
