<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <title>Contact Me</title>
    </head>
    <body class="bg-dark text-white text-center p-5">

        <button class="position-absolute top-0 start-0 m-3 border-0 bg-transparent text-white" data-bs-toggle="offcanvas" data-bs-target="#sideMenu" aria-controls="sideMenu">
            ☰ Menu
        </button>

        <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="sideMenu" aria-labelledby="sideMenuLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="sideMenuLabel">Navigation</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="list-unstyled">
                    <li><a class="btn btn-outline-light w-100 mb-2" href="index.html">Homepage</a></li>
                    <li><a class="btn btn-outline-light w-100 mb-2" href="https://cs50.harvard.edu" target="_blank">CS50 Website</a></li>
                    <li><a class="btn btn-outline-light w-100 mb-2" href="https://github.com/Gabrielpsr1" target="_blank">My GitHub</a></li>
                    <li><a class="btn btn-outline-light w-100 mb-2" href="projects.html">My Projects</a></li>
                    <li><a class="btn btn-outline-light w-100 mb-2" href="about.html">More About Me</a></li>
                    <li><a class="btn btn-outline-light w-100 mb-2" href="contact.html">Contact Me</a></li>
                </ul>
            </div>
        </div>

        <div class="container my-5">
            <h1 class="display-5 border-bottom pb-3 mb-4 text-white">Contact Me 📧</h1>
        </div>

        <div class="container my-5">
            <div class="bg-secondary text-white p-5 rounded shadow-lg">
                <h2 class="border-bottom pb-3 mb-4">Get in Touch</h2>
                <p class="fs-5 text-white-50 mb-5">
                    Have a question or just want to connect? Feel free to reach out!
                </p>

                <form action="gabriel@examplemail.com" method="post" enctype="text/plain">
                    <div class="mb-3 text-start">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="name" name="name" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control bg-dark text-white border-secondary" id="email" name="email" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control bg-dark text-white border-secondary" id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-outline-light w-100">Send Message</button>
                </form>

                <hr class="my-5 border-secondary">

                <h3 class="mb-4">Connect with me on social media</h3>
                <div class="d-flex justify-content-center">
                    <a href="https://github.com/Gabrielpsr1" target="_blank" class="btn btn-outline-light mx-2">GitHub</a>
                    <a href="#" target="I don't have one yet" class="btn btn-outline-light mx-2">LinkedIn</a>
                    <a href="#" target="same as linkedin" class="btn btn-outline-light mx-2">Twitter</a>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
